name: tests

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: suite (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.13']
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-native-capture.txt
      - name: Full suite
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee suite.log
          status=${PIPESTATUS[0]}
          summary=$(grep -E '^(Ran |OK|FAILED)' suite.log | tr '\n' ' ')
          echo "::notice title=suite ${{ matrix.os }} $(git rev-parse --short HEAD)::$summary"
          exit $status
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-${{ matrix.os }}
          path: suite.log

  windows-leveldb:
    # Roadmap M0.3: try to reproduce the intermittent Windows `.dbtmp`
    # replacement error. Every run is recorded; nothing is retried or hidden.
    name: windows leveldb repeat
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-native-capture.txt
      - name: Bounded LevelDB diagnostic (30 trials)
        id: diagnostic
        continue-on-error: true
        run: |
          status=0
          python scripts/diagnose_leveldb.py --out .test-tmp/leveldb-ci --trials 30 > diag.json 2> diag.err || status=$?
          echo "::notice title=leveldb diagnostic::exit=$status $(python -c "import json;r=json.load(open('diag.json'));print(json.dumps(r.get('totals'),separators=(',',':')),'source_unchanged=',r.get('source_unchanged'))" 2>&1 | tr -d '\r')"
          exit "$status"
      - name: Repeat LevelDB-heavy tests 10x
        id: leveldb_tests
        continue-on-error: true
        run: |
          fails=0
          for i in $(seq 1 10); do
            if python -m unittest -v test_leveldb test_inventory test_uvtt test_notes > run-$i.log 2>&1; then r=OK; else r=FAIL; fails=$((fails+1)); fi
            dbtmp=$(grep -c 'dbtmp' run-$i.log || true)
            echo "::notice title=leveldb repeat $i::$r $(grep -E '^Ran ' run-$i.log) dbtmp_mentions=$dbtmp"
          done
          echo "::notice title=leveldb repeat total::$fails of 10 runs failed"
          exit "$fails"
        working-directory: .
        env:
          PYTHONPATH: src;tests
      - name: Full suite 3x
        id: full_suites
        continue-on-error: true
        run: |
          fails=0
          for i in 1 2 3; do
            if python -m unittest discover -s tests > full-$i.log 2>&1; then r=OK; else r=FAIL; fails=$((fails+1)); fi
            echo "::notice title=windows full $i::$r $(grep -E '^(Ran |OK|FAILED)' full-$i.log | tr '\n' ' ') dbtmp_mentions=$(grep -c dbtmp full-$i.log || true)"
          done
          exit "$fails"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-leveldb-evidence
          path: |
            diag.json
            diag.err
            run-*.log
            full-*.log
            .test-tmp/leveldb-ci/**
      - name: Enforce diagnostic outcomes after evidence upload
        if: always()
        env:
          DIAGNOSTIC: ${{ steps.diagnostic.outcome }}
          LEVELDB_TESTS: ${{ steps.leveldb_tests.outcome }}
          FULL_SUITES: ${{ steps.full_suites.outcome }}
        run: |
          if [[ "$DIAGNOSTIC" != success || "$LEVELDB_TESTS" != success || "$FULL_SUITES" != success ]]; then
            echo '::error::A Windows diagnostic phase failed or did not complete; inspect the retained evidence.'
            exit 1
          fi
