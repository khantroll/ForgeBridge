[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "forgebridge"
version = "0.13.0"
description = "Convert Foundry VTT scenes and adventures into Arkenforge Toolkit content"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "plyvel-next==2.1.2",
  "Pillow>=11.3.0,<13",
  "pypdfium2==5.13.0",
  "psutil>=5.9,<8",
]

[project.scripts]
forgebridge = "forgebridge.cli:main"

[project.gui-scripts]
forgebridge-gui = "forgebridge.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forgebridge"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "forgebridge/schema"
